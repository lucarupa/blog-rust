[package]
name = "blog-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.3.9", features = ["postgres", "r2d2"] }
dotenv = "0.15.0"
actix-web = "4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
json = "0.12.4"
utoipa = { version = "5.5.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }